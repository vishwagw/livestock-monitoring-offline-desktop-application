[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livestock-engine"
version = "0.1.0"
description = "Offline spatial engine that de-duplicates livestock detections from overlapping drone imagery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyproj>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
livestock-engine = "livestock_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
